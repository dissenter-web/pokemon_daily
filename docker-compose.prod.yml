services:
  db:
    ports: []

  app:
    ports: !reset []
    expose:
      - "8000"

  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/pokemon_daily.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls:/etc/nginx/tls:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
