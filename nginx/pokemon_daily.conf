limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=20r/s;

server {
    listen 8080;
    server_name bot.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name bot.example.com;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 256k;

    location = /webhook/max {
        limit_req zone=webhook_limit burst=40 nodelay;
        proxy_pass http://app:8000/webhook/max;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
    }

    location = /health {
        proxy_pass http://app:8000/health;
    }

    location = /ready {
        proxy_pass http://app:8000/ready;
    }

    location / {
        return 404;
    }
}
